[workspace]

[package]
name = "axum-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = 3
strip = true

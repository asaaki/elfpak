[package]
name = "elfpak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true
categories = ["command-line-utilities", "development-tools", "filesystem", "virtualization"]
keywords = ["elf", "linux", "container", "rootfs", "packaging"]

[lib]
name = "elfpak"
path = "src/lib.rs"

# A wrapper around the library, so the command line is testable and readable as
# ordinary code rather than as one long `main`.
[[bin]]
name = "elfpak"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
elfpak-core = { path = "../elfpak-core", version = "0.5.2" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

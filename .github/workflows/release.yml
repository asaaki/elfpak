name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed
        uses: actions/github-script@v9
        with:
          script: |
            let ciRun;

            // CI and Release start from the same tag push. Give GitHub time to
            // register the CI run before treating its absence as a failure.
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const workflows = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'push',
                head_sha: context.sha,
              });

              ciRun = workflows.data.workflow_runs.find(run => run.name === 'CI');
              if (ciRun) break;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            if (!ciRun) {
              throw new Error(`CI workflow not found for commit ${context.sha}`);
            }

            while (ciRun.status !== 'completed') {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const workflow = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: ciRun.id,
              });
              ciRun = workflow.data;
            }

            if (ciRun.conclusion !== 'success') {
              throw new Error(`CI workflow failed with conclusion: ${ciRun.conclusion}`);
            }

  verify-version:
    name: Verify release tag
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Ensure tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tags must be v<workspace version>; expected v${version}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates.io packages
    needs: verify-version
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish elfpak-core first
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p elfpak-core
      - name: Publish elfpak
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p elfpak
      - name: Publish cargo-elfpak
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cargo-elfpak

  build-binaries:
    name: Build ${{ matrix.platform }} binaries
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            directory: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            directory: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Export static binaries from the distribution image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: release-binaries
          outputs: type=local,dest=dist/${{ matrix.directory }}
          cache-from: type=gha,scope=release-binaries-${{ matrix.directory }}
          cache-to: type=gha,scope=release-binaries-${{ matrix.directory }},mode=max
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for binary in elfpak cargo-elfpak; do
            asset="${binary}-${{ matrix.target }}"
            install -m 0755 "dist/${{ matrix.directory }}/${binary}" "release-assets/${asset}"
            (cd release-assets && sha256sum "${asset}" > "${asset}.sha256")
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error

  publish-container:
    name: Publish multi-architecture container image
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=distribution
          cache-to: type=gha,scope=distribution,mode=max

  create-github-release:
    name: Create GitHub release
    needs:
      - verify-version
      - publish-crates
      - build-binaries
      - publish-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "release-binaries-*"
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            cargo-elfpak-aarch64-unknown-linux-musl
            cargo-elfpak-aarch64-unknown-linux-musl.sha256
            cargo-elfpak-x86_64-unknown-linux-musl
            cargo-elfpak-x86_64-unknown-linux-musl.sha256
            elfpak-aarch64-unknown-linux-musl
            elfpak-aarch64-unknown-linux-musl.sha256
            elfpak-x86_64-unknown-linux-musl
            elfpak-x86_64-unknown-linux-musl.sha256
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Expected release assets:\n  %s\n' "${expected[@]}" >&2
            printf 'Actual release assets:\n  %s\n' "${actual[@]}" >&2
            exit 1
          fi
          sha256sum -c -- *.sha256
      - name: Compose release body
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
          DIGEST: ${{ needs.publish-container.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Packages"
            echo
            echo "### crates.io"
            echo
            for crate in elfpak cargo-elfpak elfpak-core; do
              echo "* [\`${crate}\` ${VERSION}](https://crates.io/crates/${crate}/${VERSION}) — [docs](https://docs.rs/${crate}/${VERSION})"
            done
            echo
            echo "#### Prebuilt binaries"
            echo
            echo "\`\`\`sh"
            echo "cargo binstall elfpak@${VERSION}"
            echo "cargo binstall cargo-elfpak@${VERSION}"
            echo "\`\`\`"
            echo
            echo "#### Build from source"
            echo
            echo "\`\`\`sh"
            echo "cargo install --locked elfpak@${VERSION}"
            echo "cargo install --locked cargo-elfpak@${VERSION}"
            echo "\`\`\`"
            echo
            echo "### Container image"
            echo
            echo "[\`${IMAGE}\`](${PACKAGE_URL}) — tags \`${VERSION}\` and \`latest\`"
            echo
            echo "\`\`\`sh"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "\`\`\`"
            if [[ -n "${DIGEST}" ]]; then
              echo
              echo "Image digest: \`${DIGEST}\`"
            fi
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

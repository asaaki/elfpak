name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed
        uses: actions/github-script@v8
        with:
          script: |
            let ciRun;

            // CI and Release start from the same tag push. Give GitHub time to
            // register the CI run before treating its absence as a failure.
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const workflows = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'push',
                head_sha: context.sha,
              });

              ciRun = workflows.data.workflow_runs.find(run => run.name === 'CI');
              if (ciRun) break;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            if (!ciRun) {
              throw new Error(`CI workflow not found for commit ${context.sha}`);
            }

            while (ciRun.status !== 'completed') {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const workflow = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: ciRun.id,
              });
              ciRun = workflow.data;
            }

            if (ciRun.conclusion !== 'success') {
              throw new Error(`CI workflow failed with conclusion: ${ciRun.conclusion}`);
            }

  verify-version:
    name: Verify release tag
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Ensure tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tags must be v<workspace version>; expected v${version}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates.io packages
    needs: verify-version
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish elfpak-core first
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p elfpak-core
      - name: Publish elfpak
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p elfpak

  build-binaries:
    name: Build ${{ matrix.platform }} binary
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            artifact: elfpak-x86_64-unknown-linux-musl
            directory: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            artifact: elfpak-aarch64-unknown-linux-musl
            directory: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Export static binary from the distribution image
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --output type=local,dest=dist/${{ matrix.directory }}
          .
      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          install -m 0755 "dist/${{ matrix.directory }}/elfpak" "release-assets/${{ matrix.artifact }}"
          sha256sum "release-assets/${{ matrix.artifact }}" > "release-assets/${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error

  publish-container:
    name: Publish multi-architecture container image
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  create-github-release:
    name: Create GitHub release
    needs:
      - verify-version
      - publish-crates
      - build-binaries
      - publish-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

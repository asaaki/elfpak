[workspace]
resolver = "3"
members = ["crates/elfpak", "crates/elfpak-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/elfpak"
description = "Package a Linux ELF application and its runtime closure into a minimal rootfs"

[workspace.dependencies]
elfpak-core = { path = "crates/elfpak-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
toml = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
resolver = "3"
members = ["crates/elfpak", "crates/elfpak-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-GitHub-owner/elfpak"
description = "Package a Linux ELF application and its runtime closure into a minimal rootfs"

# Keep compiler warnings visible across the workspace.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Assertions and error handling are the safety net; silent truncation is not.
cast_possible_truncation = "warn"
cast_lossless = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
elfpak-core = { path = "crates/elfpak-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
toml = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
